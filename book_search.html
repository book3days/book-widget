<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本を検索</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      padding: 1.5rem 1rem;
      max-width: 560px;
      margin: 0 auto;
    }
    .search-row {
      display: flex; gap: 8px; margin-bottom: 1.5rem;
    }
    input[type="text"] {
      flex: 1; font-size: 15px; padding: 8px 12px;
      border: 1px solid #ddd; border-radius: 8px; outline: none;
    }
    input[type="text"]:focus { border-color: #999; }
    button {
      padding: 8px 16px; font-size: 14px; cursor: pointer;
      border: 1px solid #ddd; border-radius: 8px; background: #fff;
    }
    button:hover { background: #f5f5f5; }
    button:active { transform: scale(0.98); }
    .result-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px; border-radius: 8px; cursor: pointer;
      border: 1px solid #eee; margin-bottom: 8px; background: #fff;
    }
    .result-item:hover { background: #f9f9f9; }
    .result-item img { width: 36px; height: 50px; object-fit: cover; border-radius: 2px; background: #f0f0f0; }
    .result-title { font-size: 14px; font-weight: 500; }
    .result-author { font-size: 12px; color: #666; }
    .detail-box {
      display: none; margin-top: 1.5rem;
      border: 1px solid #eee; border-radius: 12px; padding: 1.25rem;
    }
    .detail-top { display: flex; gap: 16px; margin-bottom: 1rem; }
    .detail-top img { width: 80px; height: 110px; object-fit: cover; border-radius: 4px; border: 1px solid #eee; }
    .detail-title { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
    .detail-author { font-size: 13px; color: #666; margin-bottom: 4px; }
    .detail-publisher { font-size: 12px; color: #aaa; }
    .detail-description {
      font-size: 13px; color: #555; line-height: 1.7;
      margin-bottom: 1rem; padding: 12px; background: #f9f9f9;
      border-radius: 8px;
    }
    .copy-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .copy-buttons button { font-size: 13px; padding: 6px 14px; }
    .copy-msg { font-size: 12px; color: #2a9d6a; margin-top: 8px; min-height: 18px; }
    .status { font-size: 13px; color: #666; padding: 8px 0; }
    .status.error { color: #c0392b; }
  </style>
</head>
<body>

<div class="search-row">
  <input type="text" id="search-input" placeholder="本のタイトルを入力...">
  <button onclick="searchBooks()">検索</button>
</div>

<div id="results"></div>

<div class="detail-box" id="book-detail">
  <div class="detail-top">
    <img id="detail-cover" src="" alt="表紙">
    <div>
      <div class="detail-title" id="detail-title"></div>
      <div class="detail-author" id="detail-author"></div>
      <div class="detail-publisher" id="detail-publisher"></div>
    </div>
  </div>
  <div class="detail-description" id="detail-description"></div>
  <div class="copy-buttons">
    <button onclick="copyTitle()">タイトルをコピー</button>
    <button onclick="copyAuthor()">著者をコピー</button>
    <button onclick="copyDescription()">あらすじをコピー</button>
    <button onclick="copyCoverUrl()">表紙URLをコピー</button>
  </div>
  <div class="copy-msg" id="copy-msg"></div>
</div>

<script>
  let selectedBook = null;

  async function searchBooks() {
    const query = document.getElementById('search-input').value.trim();
    if (!query) return;
    const resultsEl = document.getElementById('results');
    resultsEl.innerHTML = '<div class="status">検索中...</div>';
    document.getElementById('book-detail').style.display = 'none';

    try {
      const res = await fetch('https://www.googleapis.com/books/v1/volumes?q=' + encodeURIComponent(query) + ''https://www.googleapis.com/books/v1/volumes?q=' + encodeURIComponent(query) + '&langRestrict=ja&maxResults=5'maxResults=8');
      const data = await res.json();
      if (!data.items || data.items.length === 0) {
        resultsEl.innerHTML = '<div class="status">見つかりませんでした。別のタイトルで試してください。</div>';
        return;
      }
      resultsEl.innerHTML = '';
      data.items.forEach(function(item) {
        const info = item.volumeInfo;
        const cover = info.imageLinks ? info.imageLinks.thumbnail : '';
        const title = info.title || 'タイトル不明';
        const author = info.authors ? info.authors.join(', ') : '著者不明';
        const div = document.createElement('div');
        div.className = 'result-item';
        div.innerHTML = '<img src="' + cover + '" alt="表紙"><div><div class="result-title">' + title + '</div><div class="result-author">' + author + '</div></div>';
        div.onclick = function() { showDetail(item); };
        resultsEl.appendChild(div);
      });
    } catch(e) {
      resultsEl.innerHTML = '<div class="status error">エラーが発生しました。インターネット接続を確認してください。</div>';
    }
  }

  function showDetail(item) {
    const info = item.volumeInfo;
    selectedBook = info;
    document.getElementById('detail-title').textContent = info.title || '';
    document.getElementById('detail-author').textContent = info.authors ? info.authors.join(', ') : '';
    document.getElementById('detail-publisher').textContent = info.publisher || '';
    document.getElementById('detail-description').textContent = info.description || 'あらすじ情報がありません。';
    const cover = info.imageLinks ? info.imageLinks.thumbnail : '';
    document.getElementById('detail-cover').src = cover;
    document.getElementById('book-detail').style.display = 'block';
    document.getElementById('results').innerHTML = '';
  }

  function copyText(text, label) {
    navigator.clipboard.writeText(text).then(function() {
      const msg = document.getElementById('copy-msg');
      msg.textContent = label + 'をコピーしました！';
      setTimeout(function() { msg.textContent = ''; }, 2000);
    });
  }

  function copyTitle() { if(selectedBook) copyText(selectedBook.title || '', 'タイトル'); }
  function copyAuthor() { if(selectedBook) copyText((selectedBook.authors || []).join(', '), '著者'); }
  function copyDescription() { if(selectedBook) copyText(selectedBook.description || '', 'あらすじ'); }
  function copyCoverUrl() { if(selectedBook) copyText(selectedBook.imageLinks ? selectedBook.imageLinks.thumbnail : '', '表紙URL'); }

  document.getElementById('search-input').addEventListener('keydown', function(e) {
    if(e.key === 'Enter') searchBooks();
  });
</script>
</body>
</html>
