<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>読書ウィジェット</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      display: flex;
      justify-content: center;
      padding: 1.5rem 1rem;
    }
    .container { max-width: 400px; width: 100%; text-align: center; }
    .goal-row {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; margin-bottom: 1.5rem;
    }
    .goal-row span { font-size: 13px; color: #666; }
    .goal-row input[type="number"] {
      width: 64px; text-align: center; font-size: 15px; font-weight: 500;
      border: 1px solid #ddd; border-radius: 6px; padding: 4px 8px;
    }
    .count-label { font-size: 14px; color: #666; margin-bottom: 0.5rem; }
    .count-row {
      display: flex; align-items: baseline; justify-content: center;
      gap: 6px; margin-bottom: 1.5rem;
    }
    .count-number { font-size: 36px; font-weight: 500; }
    .count-goal { font-size: 16px; color: #666; }
    #book-stack {
      display: flex; flex-direction: column-reverse; align-items: center;
      gap: 3px; min-height: 220px; justify-content: flex-start;
      margin-bottom: 1.5rem;
    }
    .progress-bg {
      background: #f0f0f0; border-radius: 4px; height: 6px;
      overflow: hidden; margin-bottom: 1rem;
    }
    #progress-bar {
      height: 100%; width: 0%; background: #1a1a1a;
      border-radius: 4px; transition: width 0.4s ease;
    }
    #badge-label { font-size: 13px; color: #666; margin-bottom: 1.5rem; }
    .controls {
      display: flex; align-items: center; justify-content: center; gap: 16px;
    }
    .controls button {
      width: 36px; height: 36px; border-radius: 50%; font-size: 18px;
      cursor: pointer; border: 1px solid #ddd; background: #fff;
      display: flex; align-items: center; justify-content: center;
    }
    .controls button:hover { background: #f5f5f5; }
    .controls input[type="range"] { width: 160px; }
    .hint { font-size: 12px; color: #aaa; margin-top: 0.75rem; }
    .reset-btn {
      margin-top: 1rem; font-size: 11px; color: #aaa;
      background: none; border: none; cursor: pointer; text-decoration: underline;
      width: auto; height: auto; border-radius: 0;
    }
    .reset-btn:hover { color: #999; background: none; }
  </style>
</head>
<body>
<div class="container">
  <div class="goal-row">
    <span>目標冊数</span>
    <input type="number" id="goal-input" min="1" max="999" value="10" oninput="onGoalChange()">
    <span>冊</span>
  </div>

  <div class="count-label">読んだ本</div>
  <div class="count-row">
    <span class="count-number" id="count-display">0</span>
    <span class="count-goal" id="goal-label">/ 10冊</span>
  </div>

  <div id="book-stack"></div>

  <div class="progress-bg">
    <div id="progress-bar"></div>
  </div>

  <div id="badge-label">最初の1冊を読んでみよう！</div>

  <div class="controls">
    <button onclick="updateCount(-1)">−</button>
    <input type="range" min="0" max="10" value="0" id="slider" oninput="updateCount(null, this.value)" step="1">
    <button onclick="updateCount(1)">+</button>
  </div>
  <div class="hint">← スライダーまたはボタンで冊数を変更</div>
  <button class="reset-btn" onclick="resetAll()">リセット</button>
</div>

<script>
const colors = [
  '#B5D4F4','#9FE1CB','#F5C4B3','#F4C0D1','#C0DD97',
  '#FAC775','#CECBF6','#F09595','#5DCAA5','#85B7EB'
];

var current = 0;
var goal = 10;
var STORAGE_KEY_COUNT = 'bookwidget_count';
var STORAGE_KEY_GOAL = 'bookwidget_goal';

function loadFromStorage() {
  try {
    var savedCount = localStorage.getItem(STORAGE_KEY_COUNT);
    var savedGoal = localStorage.getItem(STORAGE_KEY_GOAL);
    if (savedGoal !== null) {
      goal = parseInt(savedGoal);
      document.getElementById('goal-input').value = goal;
      document.getElementById('goal-label').textContent = '/ ' + goal + '冊';
      document.getElementById('slider').max = goal;
    }
    if (savedCount !== null) {
      current = parseInt(savedCount);
      current = Math.min(current, goal);
    }
  } catch(e) {}
}

function saveToStorage() {
  try {
    localStorage.setItem(STORAGE_KEY_COUNT, current);
    localStorage.setItem(STORAGE_KEY_GOAL, goal);
  } catch(e) {}
}

function resetAll() {
  if (confirm('リセットしますか？')) {
    current = 0;
    goal = 10;
    document.getElementById('goal-input').value = 10;
    document.getElementById('goal-label').textContent = '/ 10冊';
    document.getElementById('slider').max = 10;
    saveToStorage();
    updateCount(0);
  }
}

function getBadge(n) {
  if (n === 0)  return '最初の1冊を読んでみよう！';
  if (n < 3)    return n + '冊達成！本の虫見習い';
  if (n < 5)    return n + '冊達成！読書スターター';
  if (n < 10)   return n + '冊達成！本好きの卵';
  if (n < 15)   return n + '冊達成！読書家';
  if (n < 20)   return n + '冊達成！本の虫';
  if (n < 35)   return n + '冊達成！読書が趣味';
  if (n < 50)   return n + '冊達成！本の探求者';
  if (n < 100)  return n + '冊達成！読書マスター';
  return n + '冊達成！本の賢者';
}

function renderBooks(n) {
  var stack = document.getElementById('book-stack');
  stack.innerHTML = '';
  for (var i = 0; i < n; i++) {
    var book = document.createElement('div');
    var w = 80 + Math.floor(Math.sin(i * 2.5) * 20);
    var h = 18 + (i % 3) * 4;
    book.style.cssText = 'width:' + w + 'px;height:' + h + 'px;background:' + colors[i % colors.length] + ';border-radius:2px 4px 4px 2px;border-left:4px solid rgba(0,0,0,0.15);display:flex;align-items:center;justify-content:flex-end;padding-right:6px;transition:all 0.3s ease;';
    var spine = document.createElement('div');
    spine.style.cssText = 'width:3px;height:60%;background:rgba(0,0,0,0.1);border-radius:1px;';
    book.appendChild(spine);
    stack.appendChild(book);
  }
}

function updateCount(delta, val) {
  if (val !== undefined && val !== null) {
    current = parseInt(val);
  } else {
    current = Math.max(0, Math.min(goal, current + delta));
  }
  document.getElementById('count-display').textContent = current;
  document.getElementById('slider').value = current;
  document.getElementById('progress-bar').style.width = Math.round(current / goal * 100) + '%';
  document.getElementById('badge-label').textContent = getBadge(current);
  renderBooks(current);
  saveToStorage();
}

function onGoalChange() {
  var val = parseInt(document.getElementById('goal-input').value);
  if (!val || val < 1) return;
  goal = val;
  document.getElementById('goal-label').textContent = '/ ' + goal + '冊';
  document.getElementById('slider').max = goal;
  current = Math.min(current, goal);
  saveToStorage();
  updateCount(0);
}

loadFromStorage();
renderBooks(current);
document.getElementById('count-display').textContent = current;
document.getElementById('slider').value = current;
document.getElementById('progress-bar').style.width = Math.round(current / goal * 100) + '%';
document.getElementById('badge-label').textContent = getBadge(current);
</script>
</body>
</html>
